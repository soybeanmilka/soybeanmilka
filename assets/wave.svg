<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60" preserveAspectRatio="none">
  <defs>
    <!-- 暖色渐变：米白 → 琥珀 → 浅金 -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFBEB" stop-opacity="0.1"/>
      <stop offset="25%"  stop-color="#E8C77A" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#D9A441" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#E8C77A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFBEB" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- 背景静态细线 -->
  <path d="M0,30 C150,8 300,52 450,30 C600,8 750,52 900,30 C1050,8 1150,44 1200,30"
        fill="none" stroke="url(#grad)" stroke-width="1.2" opacity="0.35"/>

  <!-- 流动主波：靠 stroke-dashoffset 动画产生「波在走」的效果 -->
  <path id="wave" d="M0,30 C150,8 300,52 450,30 C600,8 750,52 900,30 C1050,8 1150,44 1200,30"
        fill="none" stroke="url(#grad)" stroke-width="2.4" stroke-linecap="round"
        stroke-dasharray="90 46">
    <animate attributeName="stroke-dashoffset" from="0" to="-272" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- 反向流动的次级波，制造层次 -->
  <path d="M0,30 C200,50 350,12 550,30 C750,48 900,12 1200,30"
        fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round"
        opacity="0.6" stroke-dasharray="40 70">
    <animate attributeName="stroke-dashoffset" from="0" to="220" dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- 中间一颗缓慢呼吸的光点 -->
  <circle cx="600" cy="30" r="3.2" fill="#D9A441">
    <animate attributeName="r" values="2.2;5;2.2" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" repeatCount="indefinite"/>
  </circle>
</svg>
